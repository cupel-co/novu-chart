{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "novu.fullname" . }}
  labels:
    {{- include "novu.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ required "gateway.gatewayClassName is required when gateway.enabled is true" .Values.gateway.gatewayClassName | quote }}
  listeners:
    {{- toYaml .Values.gateway.listeners | nindent 4 }}
    {{- if .Values.gateway.tls.enabled }}
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          {{- toYaml .Values.gateway.tls.certificateRefs | nindent 10 }}
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
{{- end }}
