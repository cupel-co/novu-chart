{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "novu.fullname" . -}}
{{- $svcPortApi := .Values.api.port -}}
{{- $svcPortWeb := .Values.web.port -}}
{{- $svcPortWs := .Values.ws.port -}}
{{- $host := .Values.httpRoute.host -}}
{{- $parentName := default (include "novu.fullname" .) .Values.httpRoute.parentRef.name -}}
{{- $parentNamespace := default .Release.Namespace .Values.httpRoute.parentRef.namespace -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-api
  labels:
    {{- include "novu.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $parentName }}
      namespace: {{ $parentNamespace }}
      {{- if .Values.httpRoute.parentRef.sectionName }}
      sectionName: {{ .Values.httpRoute.parentRef.sectionName | quote }}
      {{- end }}
  hostnames:
    - "api.{{ $host }}"
  rules:
    - backendRefs:
        - name: {{ include "novu.api.fullname" . }}
          port: {{ $svcPortApi }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-web
  labels:
    {{- include "novu.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $parentName }}
      namespace: {{ $parentNamespace }}
      {{- if .Values.httpRoute.parentRef.sectionName }}
      sectionName: {{ .Values.httpRoute.parentRef.sectionName | quote }}
      {{- end }}
  hostnames:
    - "web.{{ $host }}"
  rules:
    - backendRefs:
        - name: {{ include "novu.web.fullname" . }}
          port: {{ $svcPortWeb }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-ws
  labels:
    {{- include "novu.labels" . | nindent 4 }}
    app.kubernetes.io/component: ws
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ $parentName }}
      namespace: {{ $parentNamespace }}
      {{- if .Values.httpRoute.parentRef.sectionName }}
      sectionName: {{ .Values.httpRoute.parentRef.sectionName | quote }}
      {{- end }}
  hostnames:
    - "ws.{{ $host }}"
  rules:
    - backendRefs:
        - name: {{ include "novu.ws.fullname" . }}
          port: {{ $svcPortWs }}
{{- end }}
