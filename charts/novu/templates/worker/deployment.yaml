apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "novu.worker.fullname" . }}
  labels:
    app: {{ include "novu.name" . }}
    component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "novu.name" . }}
      component: worker
  template:
    metadata:
      labels:
        app: {{ include "novu.name" . }}
        component: worker
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "novu.fullname" . }}-config
            - secretRef:
                name: {{ include "novu.fullname" . }}-secret
          {{- with .Values.worker.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: BROADCAST_QUEUE_CHUNK_SIZE
              value: "{{ .Values.worker.broadcastQueueChunkSize }}"
            - name: MULTICAST_QUEUE_CHUNK_SIZE
              value: "{{ .Values.worker.multicastQueueChunkSize }}"
            {{- if .Values.global.env.redis.host }}
            {{- if .Values.global.env.redis.existingSecret }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.env.redis.existingSecret | quote }}
                  key: {{ .Values.global.env.redis.existingSecretPasswordKey | quote }}
            {{- else if .Values.global.env.redis.password }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "novu.fullname" . }}-secret
                  key: REDIS_PASSWORD
            {{- end }}
            {{- else }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ include "redis.fullname" . }}"
                  key: redis-password
            {{- end }}
            {{- if .Values.mongodb.enabled }}
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mongodb.fullname" . }}
                  key: mongodb-root-password
            - name: MONGO_URL
              value: "mongodb://root:$(MONGO_ROOT_PASSWORD)@{{ include "mongodb.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ dig "service" "ports" "mongodb" 27017 .Values.mongodb }}/novu"
            {{- else }}
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "novu.fullname" . }}-secret
                  key: MONGO_URL
            {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      restartPolicy: Always