{{- if .Values.ws.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "novu.ws.serviceAccountName" . }}
  labels:
    app: {{ include "novu.name" . }}
    component: ws
  {{- with .Values.ws.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
